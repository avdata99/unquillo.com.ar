site:
  title: "Unquillo"
  subtitle: "Noticias y novedades de nuestra ciudad"
  description: "Portal de noticias de Unquillo, Córdoba, Argentina"
  url: "https://unquillo.com.ar"
  email: "info@unquillo.com.ar"
  language: "es"
  country: "AR"
  template: "magazine"
  map:
    latitude: -31.234125
    longitude: -64.316418
    title: "¿Dónde queda Unquillo?"
    zoom: 13

content:
  articles_on_homepage: 20
  max_description_length: 250
  max_article_age_days: 30

ads:
  # Publicidad para las paginas internas de cada noticia: usar el "name"
  # de un item de la lista de abajo. Comentado = sin publicidad interna.
  # article_ad: "La nueva app"
  items:
    - name: "Taller de Creacion Literaria - Raiz de Tres"
      horizontal: "/pub/LIT26-900x90.mp4"
      vertical: "/pub/LIT26-400x680.mp4"
      url: "https://raizdetres.com.ar/cursos/l/LIT26/"
    - name: "La nueva app"
      horizontal: "/pub/la-nueva-app-horiz.mp4"
      vertical: "/pub/la-nueva-app-400x680.mp4"
      url: "https://loteriadecordoba.com.ar/"
    - name: "Loteria de Cordoba"
      horizontal: "/pub/LOGO-900x90.mp4"
      vertical: "/pub/LOGO-400x680.mp4"
      url: "https://loteriadecordoba.com.ar/"

